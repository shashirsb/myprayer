server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 450k;
    location = /index.html {
        sub_filter_once on;
        sub_filter '<head>' '<head><meta name="myprayer-staff-service" content="enabled">';
    }
    location ~ ^/(staff/|v1/|temple$|ministry(/|$)|healthz$) {
        proxy_pass http://staff:8080;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Content-Type-Options nosniff;
    }
    location / { try_files $uri $uri/ =404; }
}
