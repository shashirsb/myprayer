services:
  staff:
    build: ../../server
    env_file: ${MYPRAYER_ENV_FILE:?Set absolute path to private runtime environment file}
    environment:
      PHOTO_REFERENCE_DIR: /run/enrollments
      PHOTO_MODE: opencv
    volumes:
      - ${MYPRAYER_ENROLLMENTS:?Set absolute protected enrollment directory}:/run/enrollments:ro
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - staff
    restart: unless-stopped
