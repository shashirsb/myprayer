 document.getElementById('nav').innerHTML=base+(staff?staffNav:publicNav);
}
function render(){document.body.className=(['visit','login'].includes(route)?route:(route==='module/0'?'staff ticket':'staff'));renderNav();let html='';const [page,arg]=route.split('/');let pageEl=document.getElementById('page');if(page==='visit'){html=`<section class="feature-hero"><img class="hero-art" src="${asset('temple-hero.jpg')}" alt="Monochrome temple gateway"><div class="hero-copy"><p class="eyebrow">Karnataka temple portal</p><h1>Plan your temple visit</h1><p>Find darshan timings, sevas and visitor facilities.</p><form class="search-row" onsubmit="event.preventDefault();searchTerm=document.getElementById('temple-search').value;go('search')"><label class="search-field">${icon('search')}<input id="temple-search" name="temple" aria-label="Temple or location" placeholder="Temple or location"></label><button class="primary">Search</button></form></div></section><section class="featured"><img src="${asset('temple-feature.jpg')}" alt="Temple exterior"><div><strong class="red">Featured</strong><h2>Kabbalamma Temple</h2><div class="featured-links"><button onclick="openDrawer('Darshan timings','service',0)">${icon('calendar')}<span>Darshan timings ›</span></button><button onclick="openDrawer('Sevas and meals','service',1)">${icon('meal')}<span>Sevas and meals ›</span></button><button onclick="openDrawer('Access and directions','service',2)">${icon('pin')}<span>Access and directions ›</span></button></div></div></section>`}else if(page==='login'){html=`<div class="login-grid"><img class="login-art" src="${asset('temple-login.jpg')}" alt="Black and white temple stone carvings"><section class="login-form"><h1>Staff login</h1><p class="sub">Sign in to your assigned temple workspace.</p><form onsubmit="event.preventDefault();signedIn=true;go('home')"><label class="field-label" for="staff-id">Staff ID or email</label><input class="field" id="staff-id" autocomplete="username" placeholder="" required><label class="field-label" for="password">Password</label><div class="password-wrap"><input class="field" id="password" type="password" autocomplete="current-password" required><button class="eye" type="button" aria-label="Show password" onclick="togglePassword(this)">${icon('eye')}</button></div><button class="primary login-submit">Sign in</button></form><div class="login-footer"><button onclick="openDrawer('Forgot password?','generic','Contact the temple administrator to recover your staff account. Authentication is simulated during Wave 1.')">Forgot password?</button><button onclick="go('visit')">Return to temple portal</button></div></section></div>`}else if(page==='home'){html=`<div class="workspace"><h1>Temple operations</h1><p class="lead muted">Manage core temple services, collections, pilgrim amenities and facility upkeep.</p><hr style="border:0;border-top:1px solid #ccc"><section class="modules-grid">${modules.map((m,i)=>`<button class="module-card" onclick="go('module/${i}')"><img src="${asset('module-'+(i+1)+'.jpg')}" alt="${esc(m.title)} illustration"><span class="card-title">${m.title}</span><span class="card-desc">${m.desc}</span></button>`).join('')}</section></div>`}else if(page==='module'){const m=modules[Number(arg)]||modules[0];const idx=Number(arg)||0;html=`<div class="workspace"><div class="crumb"><button onclick="go('home')">Modules</button> / ${idx===0?'E-ticketing':m.title}</div><div class="module-heading"><div><h1>${idx===0?'E-ticketing':m.title}</h1><p class="lead">Kabbalamma Temple</p></div>${idx===0?`<button class="primary" onclick="openDrawer('Issue e-tickets','ticket',1)">Issue ticket</button>`:''}</div>${idx===0?`<div class="ticket-metrics">${[['Tickets issued','248'],['Admitted','172'],['Slots available','56'],['Refunds pending','3']].map(([a,b])=>`<div>${a}<strong>${b}</strong></div>`).join('')}</div>`:''}<h2 class="tools-heading">${idx===0?'Ticketing tools':m.title+' tools'}</h2><section class="tools-grid">${m.tools.map((t,i)=>`<button class="tool-card" onclick="openDrawer('${esc(t)}',${idx===0?"'ticket'":"'module'"},${idx===0?i:`'${idx}:${i}'`})"><img src="${asset(idx===0?'ticket-'+(i+1)+'.jpg':'module-'+(idx+1)+'.jpg')}" alt="${esc(t)} illustration"><span class="card-title">${t}</span><span class="card-desc">${idx===0?ticketDesc[i]:'View and manage '+t.toLowerCase()+'.'}</span></button>`).join('')}</section>${idx===0?`<h2 class="section-title">Recent tickets</h2><table class="data-table"><thead><tr><th>Ticket ID</th><th>Service</th><th>Channel</th><th>Status</th></tr></thead><tbody>${[['KT458763','Darshan','Online','Admitted'],['KT458762','Darshan','Counter','Issued']].map(r=>`<tr><td><button class="rowbutton" onclick="openDrawer('Ticket ${r[0]}','record','${r[0]}')">${r[0]}</button></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="pill">${r[3]}</span></td></tr>`).join('')}</tbody></table>`:''}</div>`}else if(page==='search'){html=`<div class="workspace"><h1>Temple directory</h1><p class="lead">${searchTerm?'Search for '+esc(searchTerm):'Explore temples'}</p><button class="module-card" style="max-width:480px" onclick="openDrawer('Kabbalamma Temple','service',0)"><img src="${asset('temple-feature.jpg')}" alt="Kabbalamma Temple"><span class="card-title">Kabbalamma Temple</span><span class="card-desc">Darshan timings · Sevas · Visitor information</span></button></div>`}else if(page==='service'){html=`<div class="workspace"><h1>${['Darshan timings','Sevas and meals','Access and directions','Visitor help'][Number(arg)]||'Visitor services'}</h1><p class="lead">Kabbalamma Temple</p><button class="primary" onclick="openDrawer('Visitor information','service',${Number(arg)||0})">View details</button></div>`}else{html=`<div class="workspace"><h1>${['Organisation','Users and roles','Photo verification'][Number(arg)]||'Administration'}</h1><p class="lead">Kabbalamma Temple · Wave 1 demonstration</p><button class="primary" onclick="openDrawer('Administration details','generic','This is a static preview. RBAC, users, authentication and identity verification are part of Wave 2.')">View details</button></div>`}pageEl.innerHTML=html;document.title=(page==='visit'?'Temple visit':page==='login'?'Staff login':page==='home'?'Temple operations':page==='module'?'Temple modules':'myPrayer')+' · myPrayer';renderDrawer()}
function openDrawer(title,type,data){drawerStack.push({title,type,data});renderDrawer()}
function closeDrawer(){drawerStack=[];renderDrawer()}
function backDrawer(){drawerStack.pop();renderDrawer()}
function renderDrawer(){const root=document.getElementById('drawer-root');if(!drawerStack.length){root.innerHTML='';return}const d=drawerStack.at(-1);let body='';if(d.type==='ticket'){const i=Number(d.data),img=asset('ticket-'+(i+1)+'.jpg');body=`<img src="${img}" alt="${esc(d.title)}"><p>${ticketDesc[i]}</p>`;if(i===2){body+=`<h3>Find ticket</h3><label class="field-label">Ticket number</label><input class="field" id="ticket-query" value="KT458762"><div class="action-row"><button class="primary" onclick="openDrawer('E-ticket preview','print','KT458762')">Find ticket</button></div><p class="notice">A real operator photo check is required before printing in Wave 2. This Wave 1 preview does not verify identity or print physical tickets.</p>`}else if(i===1){body+=`<h3>Issue ticket</h3><label class="field-label">Service</label><select class="field"><option>Darshan</option><option>Archana seva</option><option>Special entry</option></select><label class="field-label">Visitor name</label><input class="field" placeholder="Visitor name"><label class="field-label">Number of visitors</label><input class="field" type="number" min="1" value="2"><button class="primary" onclick="openDrawer('Sample e-ticket','print','DEMO-001')">Preview ticket</button>`}else{body+=`<div class="action-row"><button class="primary" onclick="openDrawer('${esc(d.title)} details','generic','This clickable Wave 1 drill-down stays within the right drawer. The operational service will be implemented after milestone approval.')">Open details</button></div>`}}else if(d.type==='print'){body=`<div class="preview-ticket"><strong>Kabbalamma Temple</strong><p>Darshan · E-ticket</p><p>Ticket no. ${esc(d.data)}</p><p>Visitors: 2</p><p>Demo preview only</p></div><p class="notice">Camera identity verification and the actual print action are intentionally not enabled in Wave 1.</p><div class="action-row"><button class="button-secondary" onclick="openDrawer('Verification requirements','generic','In Wave 2, printing will require a live camera capture and liveness-checked operator match.')">View verification requirements</button></div>`}else if(d.type==='record'){body=`<h3>${esc(d.data)}</h3><div class="status-line">Service: Darshan</div><div class="status-line">Channel: Counter</div><div class="status-line">Status: Issued</div><div class="action-row"><button class="primary" onclick="openDrawer('E-ticket preview','print','${esc(d.data)}')">View ticket</button></div>`}else if(d.type==='service'){body=`<img src="${asset('temple-feature.jpg')}" alt="Temple"><p>Kabbalamma Temple · Karnataka</p><p>${['Please confirm current darshan timings with the temple office.','Explore sevas, poojas and meal services at the temple.','Visitor access, transport and directions to Kabbalu.','For visitor assistance, contact the temple office.'][Number(d.data)||0]}</p><div class="action-row"><button class="primary" onclick="go('search')">Temple directory</button></div>`}else if(d.type==='module'){body=`<p>${esc(String(d.data))}</p><p class="notice">Static preview. Clicking through demonstrates universal right-drawer navigation.</p><button class="primary" onclick="openDrawer('Record details','generic','This is a sample drill-down inside the right drawer.')">View record</button>`}else{body=`<p>${esc(d.data)}</p>`}root.innerHTML=`<div class="overlay" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(d.title)}" style="--drawer-width:${['ticket','print'].includes(d.type)?'690px':'540px'}"><div class="drawer-head">${drawerStack.length>1?'<button class="back" onclick="backDrawer()">← Back</button>':'<span>Kabbalamma Temple</span>'}<button class="close" aria-label="Close drawer" onclick="closeDrawer()">✕</button></div><h2>${d.title}</h2>${body}</aside>`}
window.addEventListener('hashchange',()=>{const target=location.hash.slice(1)||'visit';if(target!==route){route=target;drawerStack=[];currentMenu='';render()}});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});route=location.hash.slice(1)||'visit';render();
</script></body></html>
